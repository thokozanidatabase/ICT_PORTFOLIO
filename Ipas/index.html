
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Documentation Workspace</title>

<link rel="stylesheet" href="Assets/css/style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>Workspace</h2>

        <ul>

            <li class="active">
                <i class="fa-solid fa-book"></i>
                Documentation
            </li>

  <li class="active">
    <a href="files.html">
        <i class="fa-solid fa-folder"></i>
        My Files
    </a>
</li>

            <li>
                <i class="fa-solid fa-clock"></i>
                Recent
            </li>

        </ul>

    </aside>


    <!-- Main Content -->

    <main class="content">

        <div class="card">

            <h1>Documentation Workspace</h1>

            <p>
                Upload documentation, screenshots and write notes.
            </p>

            <hr>

            <h3>Upload Documentation</h3>

            <div class="upload-box">

                <i class="fa-solid fa-cloud-arrow-up"></i>

                <h2>Drag & Drop Files</h2>

                <p>or</p>

                <input type="file" id="upload">

                <label for="upload">Choose File</label>

                <small>
                    PDF • DOCX • TXT • PNG • JPG
                </small>

            </div>


            <div class="buttons">

                <button class="gold">
                    <i class="fa-solid fa-upload"></i>
                    Upload
                </button>

                <button class="outline">
                    Clear
                </button>

            </div>

            <hr>


            <h3>Add Notes</h3>

            <div class="toolbar">

                <button><b>B</b></button>

                <button><i>I</i></button>

                <button><u>U</u></button>

                <button>• List</button>

                <button>1. List</button>

                <button>
                    <i class="fa-solid fa-link"></i>
                </button>

                <button>
                    <i class="fa-solid fa-image"></i>
                </button>

            </div>

            <textarea
            placeholder="Start typing your documentation here..."></textarea>

            <div class="buttons">

                <button class="gold">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save
                </button>

                <button class="outline">
                    <i class="fa-solid fa-trash"></i>
                    Clear
                </button>

            </div>

        </div>

    </main>

</div>

</body>
</html>
